<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Sistema de Login</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

</head>

<body class="bg-light">

  <div class="container mt-5">

    <div class="row justify-content-center">

      <div class="col-md-6">

        <div class="card shadow">

          <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Sistema de Login</h3>
          </div>

          <div class="card-body">

            <!-- Mensagens -->
            <div id="mensagem"></div>

            <!-- Formulário -->
            <form>

              <div class="mb-3">
                <label class="form-label">E-mail</label>

                <input
                  type="email"
                  id="email"
                  class="form-control"
                  placeholder="Digite seu e-mail"
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Senha</label>

                <input
                  type="password"
                  id="senha"
                  class="form-control"
                  placeholder="Digite sua senha"
                />
              </div>

              <!-- Botões -->
              <div class="d-flex flex-wrap gap-2">

                <button
                  type="button"
                  class="btn btn-primary"
                  onclick="salvarLogin()"
                >
                  Salvar Login
                </button>

                <button
                  type="button"
                  class="btn btn-success"
                  onclick="buscarLogin()"
                >
                  Buscar Dados
                </button>

                <button
                  type="button"
                  class="btn btn-danger"
                  onclick="removerLogin()"
                >
                  Remover Dados
                </button>

                <button
                  type="button"
                  class="btn btn-secondary"
                  onclick="limparCampos()"
                >
                  Limpar Campos
                </button>

              </div>

            </form>

        
            <div
              id="resultado"
              class="mt-4"
            ></div>

          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="storage.js"></script>

</body>
</html>
